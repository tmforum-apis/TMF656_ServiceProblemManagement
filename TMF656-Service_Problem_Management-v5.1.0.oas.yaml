    ServiceProblemEventRecord:
      description: >-
        ServiceProblemEventRecord is a record of an event (related to a service problem) received
        from another system. It is a system-generated record that captures events related to a
        ServiceProblem, such as status changes, updates, acknowledgements, or resolution activities.
        It is not created directly by API consumers and serves as an audit and traceability
        mechanism for problem management activities.
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            eventTime:
              description: Time at which the event occurred
              type: string
              format: date-time
            eventType:
              description: >-
                Type of the recorded event. This is one of the event types of Service Problem.
                Example: ServiceProblemCreateEvent, ServiceProblemStateChangeEvent
              type: string
            recordTime:
              description: Time at which the record was created
              type: string
              format: date-time
            serviceProblem:
              $ref: '#/components/schemas/ServiceProblemRef'
            notification:
              $ref: '#/components/schemas/ServiceProblemEventNotificationType'
      discriminator:
        propertyName: '@type'
        mapping:
          ServiceProblemEventRecord: '#/components/schemas/ServiceProblemEventRecord'
