      description: >-
        impactPattern is a used to capture the nature and scope of the impact caused by a Service
        Problem. It is used to describe how a service problem affects other services or components,
        especially when the impact cannot be fully captured by predefined attributes.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - example:
            - id: IP_0001
              characteristic:
                - name: ServiceDisruption
                  value: high
                  valueType: boolean
          type: object
          properties:
            id:
