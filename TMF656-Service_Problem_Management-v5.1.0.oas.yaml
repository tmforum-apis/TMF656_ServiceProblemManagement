    GeographicSite:
      description: >-
        A GeographicSite is a managed place, such as a retail store, warehouse or data centre. It
        will have related responsible parties, a calendar of access times and be described by
        addresses and/or locations
      allOf:
        - $ref: '#/components/schemas/Place'
        - type: object
          properties:
            note:
              type: array
              description: Unstructured notes made about this site
              items:
                $ref: '#/components/schemas/Note'
            capacity:
              type: array
              description: >-
                Capacities for the site indicating maximum operational thresholds (for example:
                people, floorspace, racks)
              items:
                $ref: '#/components/schemas/Quantity'
            code:
              type: string
              description: 'Deprecated: Use id, externalIdentifier and/or siteCategory or name'
              deprecated: true
              example: BTS
            creationDate:
              type: string
              format: date-time
              description: Date and time when the GeographicSite was created
              example: '2024-09-23T00:00:00Z'
            lastUpdate:
              type: string
              format: date-time
              description: Date and time when the GeographicSite was last updated
              example: '2024-10-03T00:00:00Z'
            status:
              type: string
              description: >-
                The condition of the GeographicSite, such as planned, underConstruction, cancelled,
                active, inactive, former
              example: planned
            relatedParty:
              type: array
              description: >-
                Collection of related roles and parties references (such as site manager, site
                owner, site operator)
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            calendar:
              type: array
              description: 'Periods of (for example) access, opening, alarm, unavailability of this site'
              items:
                $ref: '#/components/schemas/CalendarPeriod'
            relatedAddress:
              type: array
              description: 'Collection of related address references (such as delivery-address, office-address)'
              items:
                $ref: '#/components/schemas/RelatedGeographicAddressRef'
            relatedLocation:
              type: array
              description: 'Collection of related location references (such as retail-complex, service-access)'
              items:
                $ref: '#/components/schemas/RelatedGeographicLocationRef'
            geographicSiteRelationship:
              type: array
              description: This site might have relationships to other sites
              items:
                $ref: '#/components/schemas/GeographicSiteRelationship'
            siteCategory:
              type: string
              description: Site classification/category.
              example: ShoppingUnit
            contactMedium:
              type: array
              description: Contact information for people with responsibility for this site
              items:
                $ref: '#/components/schemas/ContactMedium'
            siteFeature:
              type: array
              description: Collection of site features
              items:
                $ref: '#/components/schemas/GeographicSiteFeature'
          required:
            - name
