components:
  schemas:
    Addressable:
      type: object
      description: Base schema for addressable entities
      properties:
        href:
          type: string
          description: Hyperlink reference
        id:
          type: string
          description: unique identifier
    Attachment:
      description: >-
        Complements the description of an element (for instance a product) through video,
        pictures...
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            name:
              type: string
              description: The name of the attachment
            description:
              type: string
              description: A narrative text describing the content of the attachment
              example: Photograph of the Product
            url:
              type: string
              description: >-
                The URL pointing to the attachment content held in an external system, such as a
                content management system or document repository. Mutually exclusive with content.
              example: 'https://host/Content/4aafacbd-11ff-4dc8-b445-305f2215715f'
            content:
              type: string
              format: base64
              description: >-
                The actual contents of the attachment object, embedded inline and encoded as base64.
                Mutually exclusive with url.
            size:
              $ref: '#/components/schemas/Quantity'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
            attachmentType:
              type: string
              description: >-
                a business characterization of the purpose of the attachment, for example logo,
                instructionManual, contractCopy
            mimeType:
              type: string
              description: >-
                A technical characterization of the attachment content format using an IETF Media
                Type, for example application/pdf or image/png. Note: this property is named
                mimeType for historical reasons.
          required:
            - attachmentType
            - mimeType
      discriminator:
        propertyName: '@type'
        mapping:
          Attachment: '#/components/schemas/Attachment'
    Attachment_EVO:
      description: >-
