    HourPeriod:
      type: object
      description: Hour interval
      properties:
        endHour:
          type: string
          description: >-
            The end of the hour period, expressed in 24-hour HH:mm format (e.g., 12:00 for noon,
            23:59 for one minute before midnight).
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: '12:00'
        startHour:
          type: string
          description: >-
            The beginning of the hour period, expressed in 24-hour HH:mm format (e.g., 09:00 for 9
            AM, 17:30 for 5:30 PM).
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: '09:00'
